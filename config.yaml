dataset:
  name: "EuroSAT RGB"
  source: "nielsr/eurosat-demo (Hugging Face mirror)"
  source_url: "https://huggingface.co/datasets/nielsr/eurosat-demo"
  parquet_url: "https://huggingface.co/datasets/nielsr/eurosat-demo/resolve/main/data/train-00000-of-00001.parquet"
  parquet_path: "data/raw/eurosat_rgb.parquet"
  seed: 20261020
  subset_size: 2000
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15

experiment:
  seeds: [11, 23, 37]
  learning_curve_fractions: [0.10, 0.25, 0.50, 1.00]
  confidence_thresholds: [0.00, 0.40, 0.60, 0.80, 0.95]
  cpu_threads: 4

random_forest:
  n_estimators: 150
  max_depth: null
  min_samples_leaf: 1
  max_features: "sqrt"
  n_jobs: -1

cnn:
  epochs: 8
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 2
  base_channels: 16
  cpu_threads: 4
  device: "cpu"
